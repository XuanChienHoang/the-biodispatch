name: Automated Dual-Dispatch Publishing Pipeline

on:
  schedule:
    # GitHub hay trễ/bỏ lịch chạy đúng phút :00 -> dùng phút lẻ + slot dự phòng.
    # Giới hạn cứng 4 bài/ngày ở bước "Daily quota guard".
    # Slot chính (CEST): ~07:17, 11:17, 15:17, 19:17 | Dự phòng: ~09:47, 13:47, 17:47, 21:47
    - cron: '17 5,9,13,17 * * *'
    - cron: '47 7,11,15,19 * * *'
  workflow_dispatch: # Nút bấm chạy thử thủ công

concurrency:
  group: daily-dispatch
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build and Deploy Production Dispatches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Daily quota guard (max 4/day)
        id: quota
        run: |
          N=$(git log origin/main --since="$(date -u +%Y-%m-%d)T00:00:00Z" --grep="content(auto-dispatch)" --oneline | wc -l)
          echo "Auto-dispatch hôm nay: $N"
          if [ "$N" -ge 4 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Project Dependencies
        if: steps.quota.outputs.skip != 'true'
        run: npm ci
      - name: Run Autonomous Dispatch Engine
        if: steps.quota.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-dispatch.mjs
          node scripts/make-thumbs.mjs

      - name: Commit and Push New Dispatches to Main
        if: steps.quota.outputs.skip != 'true'
        run: |
          git config --global user.name "Xuan Chien Hoang"
          git config --global user.email "hoangxuanchien86@gmail.com"
          git add content/posts/ public/images/ src/lib/store.ts
          if git diff --staged --quiet; then
            echo "No new dispatches to commit."
          else
            git commit -m "content(auto-dispatch): publish scheduled bilingual dispatch"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Verify Dispatch Publishing Success
        run: |
          echo "✅ New dispatch successfully generated and pushed to GitHub main."
          echo "🚀 Site automatically updates via Git push."
