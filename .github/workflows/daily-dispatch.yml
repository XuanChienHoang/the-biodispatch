name: Automated Dual-Dispatch Publishing Pipeline

on:
  schedule:
    # 09:00 CEST (Giờ Đức)
    - cron: '0 7 * * *'
    # 13:00 CEST (Giờ Đức)
    - cron: '0 11 * * *'
  workflow_dispatch: # Nút bấm chạy thử thủ công

jobs:
  publish-and-deploy:
    name: Build and Deploy Production Dispatches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci
      - name: Run Autonomous Dispatch Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-dispatch.mjs
          node scripts/make-thumbs.mjs

      - name: Commit and Push New Dispatches to Main
        run: |
          git config --global user.name "BioDispatch Editorial Bot"
          git config --global user.email "bot@the-biodispatch.vercel.app"
          git add content/posts/ public/images/ src/lib/store.ts
          if git diff --staged --quiet; then
            echo "No new dispatches to commit."
          else
            git commit -m "content(auto-dispatch): publish scheduled bilingual dispatch"
            git push origin main
          fi
      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🧹 Checking and cancelling any stuck deployments on Vercel..."
          node -e '
            const https = require("https");
            const token = process.env.VERCEL_TOKEN;
            const projectId = process.env.VERCEL_PROJECT_ID;
            const orgId = process.env.VERCEL_ORG_ID;
            if (!token || !projectId) process.exit(0);

            const options = {
              hostname: "api.vercel.com",
              path: `/v6/deployments?projectId=${projectId}&teamId=${orgId}&state=BUILDING`,
              headers: { Authorization: `Bearer ${token}` }
            };

            https.get(options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => {
                try {
                  const json = JSON.parse(data);
                  const stuck = json.deployments || [];
                  console.log(`Found ${stuck.length} stuck BUILDING deployments.`);
                  stuck.forEach(d => {
                    console.log(`Cancelling stuck deployment: ${d.uid} (${d.url})`);
                    const cancelReq = https.request({
                      hostname: "api.vercel.com",
                      path: `/v12/deployments/${d.uid}/cancel?teamId=${orgId}`,
                      method: "PATCH",
                      headers: { Authorization: `Bearer ${token}` }
                    }, (cRes) => {
                      console.log(`Cancelled ${d.uid}: HTTP ${cRes.statusCode}`);
                    });
                    cancelReq.end();
                  });
                } catch (e) {
                  console.warn("Error parsing deployments:", e.message);
                }
              });
            }).on("error", err => console.warn("API Error:", err.message));
          '
          sleep 5
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
