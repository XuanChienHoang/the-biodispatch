name: Automated Dual-Dispatch Publishing Pipeline

on:
  schedule:
    # 09:00 CEST (Giờ Đức)
    - cron: '0 7 * * *'
    # 13:00 CEST (Giờ Đức)
    - cron: '0 11 * * *'
  workflow_dispatch: # Nút bấm chạy thử thủ công

jobs:
  publish-and-deploy:
    name: Build and Deploy Production Dispatches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci
      - name: Run Autonomous Dispatch Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-dispatch.mjs
          node scripts/make-thumbs.mjs

      - name: Commit and Push New Dispatches to Main
        run: |
          git config --global user.name "BioDispatch Editorial Bot"
          git config --global user.email "bot@the-biodispatch.vercel.app"
          git add content/posts/ public/images/ src/lib/store.ts
          if git diff --staged --quiet; then
            echo "No new dispatches to commit."
          else
            git commit -m "content(auto-dispatch): publish scheduled bilingual dispatch"
            git push origin main
          fi
      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          DEPLOY_URL=$(npx vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "Deployed to: $DEPLOY_URL"
          npx vercel alias set "$DEPLOY_URL" www.phyto-codex.org --token=$VERCEL_TOKEN
          npx vercel alias set "$DEPLOY_URL" phyto-codex.org --token=$VERCEL_TOKEN
          npx vercel alias set "$DEPLOY_URL" the-biodispatch.vercel.app --token=$VERCEL_TOKEN
